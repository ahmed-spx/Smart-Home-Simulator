services:
  backend:
    build:
      context: ./backend
    container_name: smarthome-backend
    ports:
      - "8080:8080"
    volumes:
      - ./data:/app/data
    restart: unless-stopped

  frontend:
    build:
      context: ./frontend
    container_name: smarthome-frontend
    ports:
      - "5173:80"
    depends_on:
      - backend
    restart: unless-stopped