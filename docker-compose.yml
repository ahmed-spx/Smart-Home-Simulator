services:
  backend:
    build: ./backend
    container_name: smarthome-backend
    ports:
      - "8080:8080"
    volumes:
      # Persists data/state.json + data/audit.jsonl across restarts
      - backend-data:/app/data
    restart: unless-stopped

  frontend:
    build: ./frontend
    container_name: smarthome-frontend
    ports:
      - "5173:80"
    depends_on:
      - backend
    restart: unless-stopped

volumes:
  backend-data:
