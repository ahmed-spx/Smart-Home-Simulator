# Render Blueprint: deploys the whole app as one free web service.
# In the Render dashboard: New + -> Blueprint -> connect this repo.
# Docs: https://render.com/docs/blueprint-spec
services:
  - type: web
    name: smart-home-simulator
    runtime: docker
    dockerfilePath: ./Dockerfile
    plan: free
    # Render injects $PORT; the app reads it via server.port in application.properties.
    healthCheckPath: /api/devices
    autoDeploy: true
